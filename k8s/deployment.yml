apiVersion: apps/v1
kind: Deployment
metadata:
  name: infinityx-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infinityx-orchestrator
  template:
    metadata:
      labels:
        app: infinityx-orchestrator
    spec:
      containers:
      - name: orchestrator
        image: us-east1-docker.pkg.dev/infinity-x-one-systems/ai/orchestrator:latest
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: infinityx-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: infinityx-orchestrator
spec:
  selector:
    app: infinityx-orchestrator
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
